<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1466c4">
<title>Projekt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bp">
<div class="phone">

  <!-- HOME -->
  <section id="view-home">
    <header class="topbar">
      <div class="brand">PROJEKT</div>
      <div class="brand-sub" id="home-count">— progetti</div>
    </header>
    <div id="proj-list"></div>
    <button class="fab" id="btn-new">+ NUOVO PROGETTO</button>
  </section>

  <!-- PROGETTO -->
  <section id="view-project" class="hidden">
    <header class="topbar">
      <button class="link" id="proj-back">‹ INDIETRO</button>
      <button class="link" id="proj-menu">⋯ OPZIONI</button>
    </header>
    <div id="proj-body"></div>
    <form id="add-form" class="add-form">
      <input type="text" id="add-input" placeholder="+ aggiungi cosa da fare…" autocomplete="off" enterkeyhint="done">
    </form>
  </section>

  <!-- MENU AZIONI (bottom sheet) -->
  <div id="sheet" class="sheet-wrap hidden">
    <div class="sheet-bg" id="sheet-bg"></div>
    <div class="sheet">
      <div class="sheet-title" id="sheet-title"></div>
      <div id="sheet-actions"></div>
    </div>
  </div>

  <!-- INDICATORE SYNC -->
  <div id="sync" class="sync hidden">SYNC…</div>

  <!-- TOAST / ERRORI -->
  <div id="toast" class="toast hidden"></div>

</div>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
